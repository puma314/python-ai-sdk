[project]
name = "ai-sdk"
version = "0.1.0"
description = "Python port of the Vercel AI SDK"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.10",
  "httpx>=0.27",
  "httpx-sse>=0.4",
  "anyio>=4.5",
]

[dependency-groups]
dev = [
  "ruff>=0.11",
  "pyright>=1.1",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-mock>=3.14",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
