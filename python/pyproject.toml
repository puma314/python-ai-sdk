[project]
name = 'ai-sdk-python-mirror'
version = '0.1.0'
description = 'Python type mirror for selected Vercel AI SDK modules'
requires-python = '>=3.11'
dependencies = [
  'httpx>=0.27.0',
  'pydantic>=2.11.0',
  'pytest>=8.3.0',
  'pytest-asyncio>=0.24.0',
  'typing-extensions>=4.12.0',
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ['.']
asyncio_mode = 'auto'
